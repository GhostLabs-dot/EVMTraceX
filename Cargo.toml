[package]
name = "evmtrace-tui"
version = "0.1.0"
edition = "2021"
description = "EVM execution trace explorer for developers, auditors, and security researchers."
authors = ["Genadi Avetisov"]
license = "MIT"
readme = "README.md"
homepage = "https://ghostlabs.no"
repository = "https://github.com/GhostLabs-dot/EVMTraceX"
keywords = ["ethereum", "evm", "trace", "debugging", "tui"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = ["incident*-foundry.txt", "foundry-trace.txt"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
