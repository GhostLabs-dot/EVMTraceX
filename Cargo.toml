[package]
name = "evmtrace-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal-first EVM transaction trace explorer for calls, reverts, gas and storage diffs."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ghost-labs/evmtrace-tui"
keywords = ["ethereum", "evm", "trace", "debugging", "tui"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
