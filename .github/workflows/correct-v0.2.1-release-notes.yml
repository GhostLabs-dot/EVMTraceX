name: Correct v0.2.1 release notes

on:
  push:
    branches:
      - main
    paths:
      - "docs/release-notes/v0.2.1.md"

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update published release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.2.1 --title "EVMTraceX v0.2.1" --notes-file docs/release-notes/v0.2.1.md
